<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="scoreboard">
            <div id="home_section">
                <h1>HOME</h1>
                <div id="home_score">0</div>
                <button onclick="homeAdd1Points()">+1</button>
                <button onclick="homeAdd2Points()">+2</button>
                <button onclick="homeAdd3Points()">+3</button>
            </div>
            <div id="guest_section">
                <h1>AWAY</h1>
                <div id="guest_score">0</div>
                <button onclick="guestAdd1Points()">+1</button>
                <button onclick="guestAdd2Points()">+2</button>
                <button onclick="guestAdd3Points()">+3</button>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
